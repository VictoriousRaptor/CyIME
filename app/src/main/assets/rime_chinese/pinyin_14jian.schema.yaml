translator:
  prefer_sentence_prefix: true
  dictionary: rime_ice
  prism: pinyin_14jian
  # 整句规则同 26 键（tasks-chinese.gradle.kts 由 app/data/sentence_final_particles.txt、sentence_measure_words.txt
  # 生成的那几行）：每个音节留 4 个单字同音备选，合并键读音多时“已”这类字才进得了整句（woyijiancha 出 我已检查）；
  # 语气词、量词不当句首，把/被不当句末。
  sentence_char_homophones: 4
  sentence_position_penalty: -2.0
  sentence_position_final_only: [吧, 呗, 呢, 吗, 啊, 嘛, 啦, 呀, 哦, 咯, 哟, 哇, 嘞, 喽, 个, 只, 条, 张, 件, 位, 块]
  sentence_position_initial_only: [把, 被]
  # 四条整句备选，由词组模型挑最自然的一条放第一（菜单仍只显示一条），同 26 键（t9/sentence_rescore）。
  max_sentences: 4
  sentence_cutoff_threshold: 100
  packs:
    - user_simp
  spelling_hints: 8
  preedit_format:
    - xlit/QETUOADGJZCB/qetuoadgjzcb/
    - xform/([nl])v/$1ü/
    - xform/([nl])ue/$1üe/
    - xform/([jqxy])v/$1u/

reverse_lookup:
  dictionary: stroke
  enable_completion: true
  prefix: "`"
  suffix: "'"
  tips: 〔笔画〕
  preedit_format:
    - xlit/hspnz/一丨丿丶乙/

# 生僻字按本方案的拼写规则算出每个读音的精确字母编码，合并键逐位换成键上的字母再查（AU 补 ai、si、su）。
cyime_rare_merged_keys: true

menu:
  page_size: 5

punctuator:
  import_preset: default
  __include: cyime_punctuator:/punctuator

key_binder:
  import_preset: default

recognizer:
  import_preset: default
  patterns:
    punct: "^/([0-9]+[a-z]*|[a-z]+)$"
    reverse_lookup: "`[a-z]*'?$"

# 词组模型给 Rime 的四条整句重新打分（同 26 键；2026-10-20 电脑回归：整句首选 调参 LCCC 299→365、SMS 324→387，
# 各列不变差，逐键 p95 约 +1.5%）。没有 t9_ngram.lm 时照原样只出一条。14 键不传前文，第一个词不按句首算。
t9:
  sentence_rescore: true
  ngram_model: t9_ngram
  ngram_sentence_start: false
  # 最后一个合并键按声母读出的整词（DOUA 的 A 读 s：都是）平时排在按字母拼出的整句（都啊）后面；词组模型认为它
  # 常见 20 倍以上（ln 20 ≈ 3）时排第一，整句退第二。2026-11-02「啊的权重太高」：都是、就是、我也是 排第一；
  # 真的啊、好啊、对啊、智商啊 不变。常用词 + A 键 2000 条里 179 条首选换成整词，原来的「X啊」都在第二位。
  merged_tail_word_margin: 3.0

# 英文词（同九键英文词表，按 14 键合并键编码）：整词排在中文后，按到第 4 个键起再给出最多 3 个开头相符的词。
# 中英混合词（B站、T恤）也在这张表里。选过的词和九键一样按用户词频学习（2026-11-08 以前 14 键英文不学习）。
k14_english:
  dictionary: cyime_k14_english
  enable_completion: false
  enable_sentence: false
  enable_user_dict: true
  initial_quality: -1
  # 四个键以上的整词和中英混合词（B站）：这里给的分高于单字，保证进入候选规则（cyime_candidate_policy）排的前 64 个，
  # 再由它放到所有拼全了的中文候选后面，最早第 6 位。选过的词照常按用户词频往前排。2026-11-08 以前排在全部中文后面
  # （九键 shit 第 87、14 键 B站 第 118），等于打不出来。三个键以下的纯英文词不变。
  exact_quality: 1.01
  comment_format: []
  completion_limit: 3
  completion_keys: "QETUOADGJZCBlm"

# 简/繁（设置 → 语言与方案 → 繁体输出）：与 26 键同一张台湾正体转换表，见 opencc/cyime_s2tw.json。
# 候选里显示表情（设置 › 语言与方案 › 中文输出，默认关）：打「开心」在词后面多出 😄。
# 表情表与 26 键雾凇方案共用 opencc/emoji.json；输入法按键前按设置写 emoji 选项（ImeKeyRouter）。
emoji:
  option_name: emoji
  opencc_config: emoji.json
  inherit_comment: false

# 打符号名出符号（默认关）：打「加号」「问号」「括号」时词后面多出 +、？ ?、（） ()；词本身位置不变。
# 表与 26 键共用 opencc/cyime_symbols.json；输入法按键前按设置写 cyime_symbol_names 选项（ImeKeyRouter）。
cyime_symbols:
  option_name: cyime_symbol_names
  opencc_config: cyime_symbols.json
  inherit_comment: false

traditionalize:
  option_name: traditionalization
  opencc_config: cyime_s2tw.json
  tips: none
  # 短语（user_table）交给 traditionalize_user。
  excluded_types: [user_table]

# 我的短语按 cyime_s2tw_user.json 转：没有词组管着的「余」照写的出（姓余，用户 11-12），别的字照常转。
# 其他候选上面已经转过（simplified），不再转。
traditionalize_user:
  option_name: traditionalization
  opencc_config: cyime_s2tw_user.json
  tips: none
  excluded_types: [simplified]
