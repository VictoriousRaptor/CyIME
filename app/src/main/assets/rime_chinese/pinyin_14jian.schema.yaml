# Rime schema
# 小写编码为精确字母，大写代表合并键；逐位派生支持点击与滑动混合输入。
cyime_particle_shortcuts:
  __include: cyime_particle_shortcuts:/common
  alphabet: ABCDEDGGUJJlmBOOQEATUCQZTZ

schema:
  schema_id: pinyin_14jian
  name: 中文14键
  version: "1.2"
  dependencies:
    - cyime_k14_english
  description: |
    拼音 14 键方案，字母两两合并（qw/er/ty/ui/op、as/df/gh/jk/l、zx/cv/bn/m），
    键宽更大误触更少，与九键同为词库消歧。

switches:
  - name: ascii_mode
    reset: 0
    states: [ 中文, 西文 ]
  - name: full_shape
    states: [ 半角, 全角 ]
  - name: ascii_punct
    reset: 0
    states: [ 。，, ．， ]
  - name: traditionalization
    states: [ 简, 繁 ]
  - name: emoji
    reset: 0
    states: [ 无表情, 表情 ]

engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - script_translator
    # 生僻字（设置「生僻字」，默认关；关着时只看一下开关就返回），见 lua/cyime_rare_chars.lua。
    - lua_translator@*cyime_rare_chars
    - reverse_lookup_translator
    - t9_english_translator@k14_english
    - lua_translator@*uuid
  # 与 26 键、九键同一套候选规则：长按删掉的候选不再出现、同字候选去重（cyime_candidate_policy），再去重一次。
  filters:
    - cyime_candidate_policy
    # 时间、日期、星期后面接当前时间和日期（设置 › 语言与方案 › 中文输出，默认关）。
    - cyime_datetime
    - simplifier@emoji
    # 打符号名出符号（设置 › 语言与方案 › 中文输出，默认关）：加号后面多出 +。
    - simplifier@cyime_symbols
    # 打希腊字母名出希腊字母（设置 › 语言与方案 › 中文输出，默认关）：xita 第 3 个候选是 θ Θ，见 lua/cyime_greek_letters.lua。
    - lua_filter@*cyime_greek_letters
    - simplifier@traditionalize
    # 我的短语里写的「余」照写的出（余宛如），见 traditionalize_user。
    - simplifier@traditionalize_user
    - uniquifier

speller:
  alphabet: zyxwvutsrqponmlkjihgfedcbaQETUOADGJZCB
  delimiter: " '"
  algebra:
    # 词库里的单个大写字母音节（A–Z，供 26 键直接打出字母）与合并键的大写编码同形，
    # 会被当成完整拼写，使同一输入里的简拼全部被剪掉（zdky 只出 ZDJT）。14 键用不到它们。
    - erase/^[A-Z]$/
    # 简拼与容错规则（与 pinyin_simp 一致）
    - abbrev/^([a-z]).+$/$1/
    - abbrev/^([zcs]h).+$/$1/
    - derive/^([nl])ue$/$1ve/
    # 不派生 ju/qu/xu/yu 的 v 写法：14 键上 v 和 c 同键，QC 会被读成“去”，C 就当不了声母（JQC 出不来讲清楚）。
    - derive/un$/uen/
    - derive/ui$/uei/
    - derive/iu$/iou/
    - derive/([aeiou])ng$/$1gn/
    - derive/([dtngkhrzcs])o(u|ng)$/$1o/
    - derive/ong$/on/
    - derive/ao$/oa/
    - derive/([iu])a(o|ng?)$/a$1$2/
    # 每一位可独立为精确字母或合并键，不将精确字母重新映射成歧义编码。
    - derive/^(.{0})[qw](.*)$/$1Q$2/
    - derive/^(.{0})[er](.*)$/$1E$2/
    - derive/^(.{0})[ty](.*)$/$1T$2/
    - derive/^(.{0})[ui](.*)$/$1U$2/
    - derive/^(.{0})[op](.*)$/$1O$2/
    - derive/^(.{0})[as](.*)$/$1A$2/
    - derive/^(.{0})[df](.*)$/$1D$2/
    - derive/^(.{0})[gh](.*)$/$1G$2/
    - derive/^(.{0})[jk](.*)$/$1J$2/
    - derive/^(.{0})[zx](.*)$/$1Z$2/
    - derive/^(.{0})[cv](.*)$/$1C$2/
    - derive/^(.{0})[bn](.*)$/$1B$2/
    - derive/^(.{1})[qw](.*)$/$1Q$2/
    - derive/^(.{1})[er](.*)$/$1E$2/
    - derive/^(.{1})[ty](.*)$/$1T$2/
    - derive/^(.{1})[ui](.*)$/$1U$2/
    - derive/^(.{1})[op](.*)$/$1O$2/
    - derive/^(.{1})[as](.*)$/$1A$2/
    - derive/^(.{1})[df](.*)$/$1D$2/
    - derive/^(.{1})[gh](.*)$/$1G$2/
    - derive/^(.{1})[jk](.*)$/$1J$2/
    - derive/^(.{1})[zx](.*)$/$1Z$2/
    - derive/^(.{1})[cv](.*)$/$1C$2/
    - derive/^(.{1})[bn](.*)$/$1B$2/
    - derive/^(.{2})[qw](.*)$/$1Q$2/
    - derive/^(.{2})[er](.*)$/$1E$2/
    - derive/^(.{2})[ty](.*)$/$1T$2/
    - derive/^(.{2})[ui](.*)$/$1U$2/
    - derive/^(.{2})[op](.*)$/$1O$2/
    - derive/^(.{2})[as](.*)$/$1A$2/
    - derive/^(.{2})[df](.*)$/$1D$2/
    - derive/^(.{2})[gh](.*)$/$1G$2/
    - derive/^(.{2})[jk](.*)$/$1J$2/
    - derive/^(.{2})[zx](.*)$/$1Z$2/
    - derive/^(.{2})[cv](.*)$/$1C$2/
    - derive/^(.{2})[bn](.*)$/$1B$2/
    - derive/^(.{3})[qw](.*)$/$1Q$2/
    - derive/^(.{3})[er](.*)$/$1E$2/
    - derive/^(.{3})[ty](.*)$/$1T$2/
    - derive/^(.{3})[ui](.*)$/$1U$2/
    - derive/^(.{3})[op](.*)$/$1O$2/
    - derive/^(.{3})[as](.*)$/$1A$2/
    - derive/^(.{3})[df](.*)$/$1D$2/
    - derive/^(.{3})[gh](.*)$/$1G$2/
    - derive/^(.{3})[jk](.*)$/$1J$2/
    - derive/^(.{3})[zx](.*)$/$1Z$2/
