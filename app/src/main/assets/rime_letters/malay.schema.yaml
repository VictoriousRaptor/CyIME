# CyIME 马来语：字母像英文一样逐字直接上屏，补全由应用按商店里的马来语补全词表给出。
# 这个方案只是语言入口（语言列表、语言键、键盘布局 qwerty_malay 都按方案识别），
# 不组字、不翻译、不转标点：按键交回应用原样上屏。
schema:
  schema_id: malay
  name: 马来语
  version: "1"
  author:
    - Cyletix
  description: |
    马来语 26 键；叠词打 kanak- 就补 kanak-kanak，马来语词不够时补英文词。

switches:
  - name: ascii_mode
    states: [ MS, ABC ]
    reset: 0

engine:
  processors:
    - express_editor
  segmentors:
    - fallback_segmentor
  translators:
    - echo_translator
