name: Full Test Suite
run-name: Gradle test - ${{ inputs.source_ref || github.ref_name }}

permissions:
  contents: read
  actions: read
  checks: write

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Source branch, tag or commit to test (blank uses workflow ref)'
        required: false
        default: ''
        type: string
      run_instrumented_tests:
        description: 'Run instrumented tests (requires emulator)'
        required: false
        default: false
        type: boolean

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    name: Unit Tests
    outputs:
      test-results-id: ${{ steps.test-results.outputs.artifact-id }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref || github.ref }}
          submodules: recursive
          fetch-depth: 0
        
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
          
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
        
      - name: Install NDK
        run: |
          sdkmanager "ndk;29.0.14206865"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> $GITHUB_ENV

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Cache native deps
        uses: actions/cache@v6
        with:
          path: |
            app/src/main/jni/onnxruntime
            app/src/main/jniLibs/**/libonnxruntime.so
          key: native-${{ runner.os }}-${{ hashFiles('app/build-logic/tasks-native.gradle.kts') }}
          restore-keys: |
            native-${{ runner.os }}-

      - name: Download native deps (ONNX Runtime)
        run: ./gradlew downloadOnnx --no-daemon

      - name: Cache CMake build
        uses: actions/cache@v6
        with:
          path: |
            app/.cxx
            app/src/main/jni/boost
            app/src/main/jni/boost-*.tar.xz
          key: cmake-${{ runner.os }}-${{ hashFiles('app/src/main/jni/CMakeLists.txt') }}
          restore-keys: |
            cmake-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run All Gradle Unit Tests
        run: |
          git show -s --format='%H %s' HEAD
          # JVM tests do not load Android JNI libraries. Japanese dictionary tests
          # supply their own fixtures; keep the generated Chinese/stroke/cangjie assets.
          ./gradlew test --no-daemon --max-workers=2 --console=plain \
            -x :app:prepareAzooKeyLibraries \
            -x :app:prepareOfflineTranslateLibraries \
            -x :app:prepareJapaneseDictionaries
        
      - name: Generate Test Report
        if: always()
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: '**/build/test-results/test*UnitTest/*.xml'
          fail_on_failure: true
          
      - name: Upload Test Results
        id: test-results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results
          path: |
            **/build/test-results/test*UnitTest/
            **/build/reports/tests/test*UnitTest/
          retention-days: 7

  instrumented-tests:
    if: ${{ github.event.inputs.run_instrumented_tests == 'true' }}
    runs-on: ubuntu-latest
    name: Instrumented Tests
    needs: unit-tests
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref || github.ref }}
          submodules: recursive
          fetch-depth: 0
        
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
          
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
        
      - name: Install NDK
        run: |
          sdkmanager "ndk;29.0.14206865"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> $GITHUB_ENV

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Download native deps (ONNX Runtime)
        run: ./gradlew downloadOnnx --no-daemon

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
        
      - name: Cache CMake build
        uses: actions/cache@v6
        with:
          path: |
            app/.cxx
            app/src/main/jni/boost
            app/src/main/jni/boost-*.tar.xz
          key: cmake-${{ runner.os }}-${{ hashFiles('app/src/main/jni/CMakeLists.txt') }}
          restore-keys: |
            cmake-${{ runner.os }}-
            
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        
      - name: Run Instrumented Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_3a
          script: ./gradlew :app:connectedDebugAndroidTest --no-daemon
        
      - name: Upload Instrumented Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: instrumented-test-results
          path: app/build/outputs/androidTest-results/connected/
          retention-days: 7

  test-coverage:
    runs-on: ubuntu-latest
    name: Test Coverage Report
    needs: [unit-tests]
    if: ${{ always() && needs.unit-tests.outputs.test-results-id != '' }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        
      - name: Download Test Results
        uses: actions/download-artifact@v8
        with:
          name: unit-test-results
          path: test-results/
          
      - name: Generate Coverage Summary
        run: |
          echo "## Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Unit Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Count test files
          TEST_FILES=$(find test-results -name "*.xml" | wc -l)
          echo "Total test result files: $TEST_FILES" >> $GITHUB_STEP_SUMMARY
          
          # upload-artifact preserves module/variant directories; recurse through all of them.
          python3 - <<'PY'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET

          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              for xml_file in sorted(Path('test-results').rglob('TEST-*.xml')):
                  suite = ET.parse(xml_file).getroot()
                  counts = {key: int(suite.get(key, '0')) for key in ('tests', 'failures', 'errors', 'skipped')}
                  summary.write(f"- {xml_file}: {counts['tests']} tests, {counts['failures']} failures, "
                                f"{counts['errors']} errors, {counts['skipped']} skipped\n")
          PY
