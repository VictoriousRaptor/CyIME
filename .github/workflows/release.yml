name: Build and Release APK

on:
  push:
    branches:
      - 'codex/aosp-release-*'
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.repository == 'Cyletix/CyIME' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install NDK
        run: |
          sdkmanager "ndk;29.0.14206865"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> $GITHUB_ENV
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/29.0.14206865" >> $GITHUB_ENV

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Cache native deps
        uses: actions/cache@v6
        with:
          path: |
            app/src/main/jni/onnxruntime
            app/src/main/jniLibs/**/libonnxruntime.so
          key: native-${{ runner.os }}-${{ hashFiles('app/build-logic/tasks-native.gradle.kts') }}
          restore-keys: |
            native-${{ runner.os }}-

      - name: Download native deps (ONNX Runtime)
        run: ./gradlew downloadOnnx --no-daemon

      - name: Cache CMake build
        uses: actions/cache@v6
        with:
          path: |
            app/.cxx
            app/src/main/jni/boost
            app/src/main/jni/boost-*.tar.xz
          key: cmake-${{ runner.os }}-${{ hashFiles('app/src/main/jni/CMakeLists.txt') }}
          restore-keys: |
            cmake-${{ runner.os }}-

      - name: Setup signing keystore
        run: |
          cat > app/keystore.properties <<'EOF'
          keyBase64=${{ secrets.SIGNING_KEY }}
          storePassword=${{ secrets.KEY_STORE_PASSWORD }}
          keyAlias=${{ secrets.ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Required rendered layout gate
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_3a
          script: ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.kingzcheung.xime.ui.LayoutGeometryGateTest,com.kingzcheung.xime.ui.PanelLayoutAuditTest,com.kingzcheung.xime.ui.ExpandedCandidateLayoutTest,com.kingzcheung.xime.ui.OfflineEditionTest,com.kingzcheung.xime.ui.VisualStyleIntegrationTest,com.kingzcheung.xime.ui.IconAppearanceTest --no-daemon

      - name: Keep layout gate reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-layout-gate
          path: app/build/outputs/androidTest-results/connected/

      - name: Build Release APKs (Signed)
        # A failed geometry test aborts this job before any release asset is built/uploaded.
        if: success()
        run: |
          ./gradlew assembleRelease --no-daemon
          mkdir -p app/build/outputs/apk/distribution
          cp app/build/outputs/apk/release/CyIME-*.apk app/build/outputs/apk/distribution/

      - name: Required offline edition gate
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_3a
          script: ./gradlew :app:connectedDebugAndroidTest -PbundleModels=true -PpythonExecutable=python3 -Pandroid.testInstrumentationRunnerArguments.class=com.kingzcheung.xime.ui.LayoutGeometryGateTest,com.kingzcheung.xime.ui.PanelLayoutAuditTest,com.kingzcheung.xime.ui.ExpandedCandidateLayoutTest,com.kingzcheung.xime.ui.OfflineEditionTest,com.kingzcheung.xime.ui.VisualStyleIntegrationTest,com.kingzcheung.xime.ui.IconAppearanceTest --no-daemon

      - name: Build offline Release APKs
        run: |
          ./gradlew assembleRelease -PbundleModels=true -PpythonExecutable=python3 --no-daemon
          cp app/build/outputs/apk/release/CyIME-*-full-*.apk app/build/outputs/apk/distribution/

      - name: Build Plugin XIPKs (Unsigned)
        run: bash scripts/build-plugins.sh

      - name: Verify APK signatures
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          for apk in app/build/outputs/apk/distribution/CyIME-*.apk; do
            OUT=$("$APKSIGNER" verify --verbose --min-sdk-version 23 --print-certs "$apk")
            # vivo OriginOS rejects APKs without a v1 (JAR) signature as 「安装包缺乏开发者证书」.
            # --min-sdk-version 23: for minSdk >= 24 apksigner skips v1 and always reports it false.
            echo "$OUT" | grep -q 'Verified using v1 scheme (JAR signing): true'
            echo "$OUT" | grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true'
            echo "Verified: $apk"
          done

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Find APKs and plugin XIPKs
        id: find_apks
        run: |
          MAIN_APKS=$(find app/build/outputs/apk/distribution -name "CyIME-*.apk" -type f | sort | tr '\n' ',' | sed 's/,$//')
          PLUGIN_XIPKS=$(find build/plugin-release -name "*.xipk" -type f | sort | tr '\n' ',' | sed 's/,$//')

          echo "main_apks=$MAIN_APKS" >> $GITHUB_OUTPUT
          echo "plugin_xipks=$PLUGIN_XIPKS" >> $GITHUB_OUTPUT

          if [ -z "$MAIN_APKS" ]; then
            echo "::warning::No main app APKs found!"
          fi
          if [ -z "$PLUGIN_XIPKS" ]; then
            echo "::warning::No plugin XIPKs found!"
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          name: CyIME ${{ steps.get_version.outputs.VERSION }}
          generate_release_notes: false
          files: |
            ${{ steps.find_apks.outputs.main_apks }}
            ${{ steps.find_apks.outputs.plugin_xipks }}
          overwrite: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  aosp-release:
    if: github.event.repository.fork
    name: AOSP-signed ARM64 Release
    # Swift 6.2's setup action supports Ubuntu 24.04; ubuntu-latest can move to newer releases.
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write
    concurrency:
      group: aosp-release-${{ github.ref }}
      cancel-in-progress: true
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false
    steps:
      - name: Check out source and native submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare release version
        id: release_version
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import re
          import subprocess

          commit = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          path = Path('app/build.gradle.kts')
          text = path.read_text(encoding='utf-8')
          versions = re.findall(r'versionName = "([^"]+)"', text)
          if len(versions) != 1:
              raise ValueError('Expected exactly one source versionName')
          version = f'{versions[0]}-{commit[:8]}'
          with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as output:
              output.write(f'base_version={versions[0]}\n')
              output.write(f'version={version}\ntag=custom-v{version}\ncommit={commit}\n')
          PY

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install project native toolchain
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;29.0.14206865' 'cmake;3.22.1'

      - name: Route Swift key refresh through HKPS
        shell: bash
        run: |
          # setup-swift@v2.4.0 hard-codes plain HKP for this refresh. Route only that
          # command through HKPS; the bundled keys still verify the toolchain signature.
          wrapper_dir="$RUNNER_TEMP/swift-gpg-wrapper"
          mkdir -p "$wrapper_dir"
          cat > "$wrapper_dir/gpg" <<'EOF'
          #!/usr/bin/env bash
          if [[ "$#" -eq 4 && "$1" == "--keyserver" && "$2" == "hkp://keyserver.ubuntu.com" && "$3" == "--refresh-keys" && "$4" == "Swift" ]]; then
            if /usr/bin/gpg --keyserver "hkps://keyserver.ubuntu.com" --refresh-keys Swift; then
              exit 0
            fi
            echo "Warning: Swift signing-key refresh failed; continuing with the imported keys." >&2
            exit 0
          fi
          exec /usr/bin/gpg "$@"
          EOF
          chmod +x "$wrapper_dir/gpg"
          echo "$wrapper_dir" >> "$GITHUB_PATH"

      - name: Set up pinned Swift compiler
        uses: swift-actions/setup-swift@v2.4.0
        with:
          swift-version: '6.2.0'

      - name: Install pinned Swift Android SDK
        run: |
          swift sdk install \
            https://github.com/finagolfin/swift-android-sdk/releases/download/6.2/swift-6.2-RELEASE-android-24-0.1.artifactbundle.tar.gz \
            --checksum c26ebfd4e32c0ca1beabcc45729b62042da57ee76d7d043f63f2235da90dc491

      - name: Build missing native dependencies from pinned sources
        env:
          ABIS: arm64-v8a
          JOBS: '2'
        run: |
          sh -n tools/azookey/build-android.sh
          sh -n tools/azookey/build-dictionary.sh
          sh -n tools/offline_translate/build-android.sh
          export PATH="$ANDROID_HOME/cmake/3.22.1/bin:$PATH"
          export ANDROID_NDK="$ANDROID_HOME/ndk/29.0.14206865"
          WORK="$GITHUB_WORKSPACE/.codex-artifacts/ci-native/azookey" sh tools/azookey/build-android.sh
          WORK="$GITHUB_WORKSPACE/.codex-artifacts/ci-native/azookey" sh tools/azookey/build-dictionary.sh
          WORK="$GITHUB_WORKSPACE/.codex-artifacts/ci-native/translate" sh tools/offline_translate/build-android.sh
          python3 scripts/ci-native-properties.py

      - name: Cache native dependencies and dictionaries
        uses: actions/cache@v6
        with:
          path: |
            app/src/main/jni/boost
            app/src/main/jni/onnxruntime
            app/src/main/jniLibs
            app/build/generated
            app/build/speech-runtime
            .gradle/chinese-data
            .gradle/stroke-data
            .gradle/cangjie-data
            .gradle/japanese-data
          key: aosp-native-${{ runner.os }}-${{ hashFiles('app/build-logic/*.gradle.kts', 'app/src/main/jni/cmake/Boost.cmake') }}

      - name: Use official Gradle distribution endpoint
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('gradle/wrapper/gradle-wrapper.properties')
          text = path.read_text()
          text = text.replace('mirrors.cloud.tencent.com/gradle/', 'services.gradle.org/distributions/')
          path.write_text(text)
          PY
          chmod +x gradlew

      - name: Compile ARM64 release from source
        run: |
          ./gradlew :app:assembleRelease -I scripts/phone-release-abi.gradle \
            -PbundleModels=false --no-daemon --max-workers=2 --console=plain

      - name: Run keyboard regression tests
        run: |
          ./gradlew :app:testDebugUnitTest -I scripts/phone-release-abi.gradle \
            --tests com.kingzcheung.xime.keyboard.KeyboardModeNavigationTest \
            --tests com.kingzcheung.xime.settings.SettingsRoundTripTest \
            --tests com.kingzcheung.xime.ui.keyboard.KeyboardInputPreferencesTest \
            --tests com.kingzcheung.xime.ui.keyboard.T9CtrlKeyTest \
            --tests com.kingzcheung.xime.ui.render.SymbolKeyCycleRenderTest \
            --no-daemon --max-workers=2 --console=plain

      - name: Sign and verify release with AOSP testkey
        run: python3 scripts/sign-aosp-release.py

      - name: Upload signed release
        uses: actions/upload-artifact@v7
        with:
          name: CyIME-AOSP-release-arm64-v8a-${{ github.run_number }}
          path: build/aosp-release/
          if-no-files-found: error
          retention-days: 30

      - name: Publish custom GitHub Release
        if: github.ref == 'refs/heads/custom'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release_version.outputs.tag }}
          target_commitish: ${{ steps.release_version.outputs.commit }}
          name: CyIME ${{ steps.release_version.outputs.version }}
          body: |
            ARM64 Release APK signed with the existing public AOSP testkey.
            Source commit: ${{ steps.release_version.outputs.commit }}
            Build: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            Download the APK and SHA256SUMS together, then run `sha256sum -c SHA256SUMS` to verify.
          files: |
            build/aosp-release/CyIME-${{ steps.release_version.outputs.base_version }}-testkey-arm64-v8a.apk
            build/aosp-release/SHA256SUMS
          fail_on_unmatched_files: true
          draft: false
          prerelease: false

      - name: Upload regression reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: aosp-release-tests-${{ github.run_number }}
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 14
