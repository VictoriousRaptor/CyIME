name: Build and Release APK

on:
  push:
    branches:
      - 'codex/aosp-release-*'
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.repository == 'Cyletix/CyIME' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install NDK
        run: |
          sdkmanager "ndk;29.0.14206865"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> $GITHUB_ENV
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/29.0.14206865" >> $GITHUB_ENV

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Cache native deps
        uses: actions/cache@v6
        with:
          path: |
            app/src/main/jni/onnxruntime
            app/src/main/jniLibs/**/libonnxruntime.so
          key: native-${{ runner.os }}-${{ hashFiles('app/build-logic/tasks-native.gradle.kts') }}
          restore-keys: |
            native-${{ runner.os }}-

      - name: Download native deps (ONNX Runtime)
        run: ./gradlew downloadOnnx --no-daemon

      - name: Cache CMake build
        uses: actions/cache@v6
        with:
          path: |
            app/.cxx
            app/src/main/jni/boost
            app/src/main/jni/boost-*.tar.xz
          key: cmake-${{ runner.os }}-${{ hashFiles('app/src/main/jni/CMakeLists.txt') }}
          restore-keys: |
            cmake-${{ runner.os }}-

      - name: Setup signing keystore
        run: |
          cat > app/keystore.properties <<'EOF'
          keyBase64=${{ secrets.SIGNING_KEY }}
          storePassword=${{ secrets.KEY_STORE_PASSWORD }}
          keyAlias=${{ secrets.ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Required rendered layout gate
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_3a
          script: ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.kingzcheung.xime.ui.LayoutGeometryGateTest,com.kingzcheung.xime.ui.PanelLayoutAuditTest,com.kingzcheung.xime.ui.ExpandedCandidateLayoutTest,com.kingzcheung.xime.ui.OfflineEditionTest,com.kingzcheung.xime.ui.VisualStyleIntegrationTest,com.kingzcheung.xime.ui.IconAppearanceTest --no-daemon

      - name: Keep layout gate reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-layout-gate
          path: app/build/outputs/androidTest-results/connected/

      - name: Build Release APKs (Signed)
        # A failed geometry test aborts this job before any release asset is built/uploaded.
        if: success()
        run: |
          ./gradlew assembleRelease --no-daemon
          mkdir -p app/build/outputs/apk/distribution
          cp app/build/outputs/apk/release/CyIME-*.apk app/build/outputs/apk/distribution/

      - name: Required offline edition gate
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_3a
          script: ./gradlew :app:connectedDebugAndroidTest -PbundleModels=true -PpythonExecutable=python3 -Pandroid.testInstrumentationRunnerArguments.class=com.kingzcheung.xime.ui.LayoutGeometryGateTest,com.kingzcheung.xime.ui.PanelLayoutAuditTest,com.kingzcheung.xime.ui.ExpandedCandidateLayoutTest,com.kingzcheung.xime.ui.OfflineEditionTest,com.kingzcheung.xime.ui.VisualStyleIntegrationTest,com.kingzcheung.xime.ui.IconAppearanceTest --no-daemon

      - name: Build offline Release APKs
        run: |
          ./gradlew assembleRelease -PbundleModels=true -PpythonExecutable=python3 --no-daemon
          cp app/build/outputs/apk/release/CyIME-*-full-*.apk app/build/outputs/apk/distribution/

      - name: Build Plugin XIPKs (Unsigned)
        run: bash scripts/build-plugins.sh

      - name: Verify APK signatures
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          for apk in app/build/outputs/apk/distribution/CyIME-*.apk; do
            OUT=$("$APKSIGNER" verify --verbose --min-sdk-version 23 --print-certs "$apk")
            # vivo OriginOS rejects APKs without a v1 (JAR) signature as 「安装包缺乏开发者证书」.
            # --min-sdk-version 23: for minSdk >= 24 apksigner skips v1 and always reports it false.
            echo "$OUT" | grep -q 'Verified using v1 scheme (JAR signing): true'
            echo "$OUT" | grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true'
            echo "Verified: $apk"
          done

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Find APKs and plugin XIPKs
        id: find_apks
        run: |
          MAIN_APKS=$(find app/build/outputs/apk/distribution -name "CyIME-*.apk" -type f | sort | tr '\n' ',' | sed 's/,$//')
          PLUGIN_XIPKS=$(find build/plugin-release -name "*.xipk" -type f | sort | tr '\n' ',' | sed 's/,$//')

          echo "main_apks=$MAIN_APKS" >> $GITHUB_OUTPUT
          echo "plugin_xipks=$PLUGIN_XIPKS" >> $GITHUB_OUTPUT

          if [ -z "$MAIN_APKS" ]; then
            echo "::warning::No main app APKs found!"
          fi
          if [ -z "$PLUGIN_XIPKS" ]; then
            echo "::warning::No plugin XIPKs found!"
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          name: CyIME ${{ steps.get_version.outputs.VERSION }}
          generate_release_notes: false
          files: |
            ${{ steps.find_apks.outputs.main_apks }}
            ${{ steps.find_apks.outputs.plugin_xipks }}
          overwrite: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  aosp-release:
    if: github.event.repository.fork
    name: AOSP-signed ARM64 Release
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    concurrency:
      group: aosp-release-${{ github.ref }}
      cancel-in-progress: true
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false
    steps:
      - name: Check out source and native submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install project native toolchain
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;29.0.14206865' 'cmake;3.22.1'

      - name: Cache native dependencies and dictionaries
        uses: actions/cache@v6
        with:
          path: |
            app/src/main/jni/boost
            app/src/main/jni/onnxruntime
            app/src/main/jniLibs
            app/build/generated
            app/build/speech-runtime
            .gradle/chinese-data
            .gradle/stroke-data
            .gradle/cangjie-data
            .gradle/japanese-data
          key: aosp-native-${{ runner.os }}-${{ hashFiles('app/build-logic/*.gradle.kts', 'app/src/main/jni/cmake/Boost.cmake') }}

      - name: Use official Gradle distribution endpoint
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('gradle/wrapper/gradle-wrapper.properties')
          text = path.read_text()
          text = text.replace('mirrors.cloud.tencent.com/gradle/', 'services.gradle.org/distributions/')
          path.write_text(text)
          PY
          chmod +x gradlew

      - name: Compile ARM64 release from source
        run: |
          ./gradlew :app:assembleRelease -I scripts/phone-release-abi.gradle \
            -PbundleModels=false --no-daemon --max-workers=2 --console=plain

      - name: Run keyboard regression tests
        run: |
          ./gradlew :app:testDebugUnitTest -I scripts/phone-release-abi.gradle \
            --tests com.kingzcheung.xime.keyboard.KeyboardModeNavigationTest \
            --tests com.kingzcheung.xime.settings.SettingsRoundTripTest \
            --tests com.kingzcheung.xime.ui.keyboard.KeyboardInputPreferencesTest \
            --tests com.kingzcheung.xime.ui.keyboard.T9CtrlKeyTest \
            --tests com.kingzcheung.xime.ui.render.SymbolKeyCycleRenderTest \
            --no-daemon --max-workers=2 --console=plain

      - name: Sign and verify release with AOSP testkey
        run: python3 scripts/sign-aosp-release.py

      - name: Upload signed release
        uses: actions/upload-artifact@v7
        with:
          name: CyIME-AOSP-release-arm64-v8a-${{ github.run_number }}
          path: build/aosp-release/
          if-no-files-found: error
          retention-days: 30

      - name: Upload regression reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: aosp-release-tests-${{ github.run_number }}
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 14
