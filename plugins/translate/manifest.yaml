# =============================================
# CyIME Lua 插件元数据（宿主用 YAML 解析）
# =============================================

id: com.kingzcheung.xime.plugin.translate

name: 翻译
icon: "译"
description: 点键盘菜单里的「翻译」，键盘上方多一行输入栏：在栏里打中文，停一下，译文就写进聊天框，点应用的发送就行。默认互译：打界面语言（中文界面就是中文）译成英文，打别的语言译成中文；左边点语言换原文语言和目标语言，长按工具栏的「翻译」直接选目标语言，再点一次「翻译」关上。在线可用讯飞机器翻译、讯飞星火 X2 或自己的 OpenAI 兼容接口，密钥只存在手机里；不填就用离线翻译（中英互译，先下载模型，不联网）。

version: 0.4.2

type: tool
activation: multi

entry: main.lua

# 翻译栏（display: live）从这一版宿主起才有
minHostVersion: 1.15.59

toolbarButtons:
  - id: com.kingzcheung.xime.plugin.translate:open
    label: 翻译
    action: open_panel

# 接口地址由用户填写，域名在第一次使用时授权
network:
  allowCustomHosts: true

capabilities:
  # 离线翻译：宿主注入 host.translate（1.15.69 起；旧宿主没有，就只能用接口）
  offline_translate: true
  tool:
    # live：键盘上方一行输入栏，停手后自动翻译，译文写进输入框（未确认，再打字整段换掉）
    display: live
